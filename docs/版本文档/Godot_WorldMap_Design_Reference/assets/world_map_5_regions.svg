  <!-- labels -->
  <text class="region-label" x="280" y="220">NORTH SEA</text><text class="region-sub" x="280" y="248">sea_001</text>
  <text class="region-label" x="635" y="205">BLUE MIST SEA</text><text class="region-sub" x="635" y="235">sea_002</text>
  <text class="region-label" x="1050" y="230">EAST TIDE</text><text class="region-sub" x="1050" y="258">sea_003</text>
  <text class="region-label" x="500" y="420">MIST RING SEA</text><text class="region-sub" x="500" y="448">sea_004 · SELECTED</text>
  <text class="region-label" x="1000" y="500">WHALE SONG SEA</text><text class="region-sub" x="1000" y="528">sea_005</text>
  <!-- illustrative route connections -->
  <g fill="none" stroke="#fff3ab" stroke-width="6" stroke-linecap="round" stroke-dasharray="12 13">
    <path d="M500 465 C570 420 605 360 635 275"/>
    <path d="M650 280 C790 235 910 250 1035 285"/>
    <path d="M535 510 C650 565 820 570 985 555"/>
