  </g>
  <!-- info card -->
  <rect x="1030" y="25" width="330" height="118" rx="18" fill="url(#panel)" stroke="#9bd8e8" stroke-width="2"/>
  <text x="1055" y="62" font-family="Noto Sans CJK SC" font-size="22" font-weight="700" fill="#fff">区域信息（交互示意）</text>
  <text x="1055" y="93" class="small">名称：雾环海域</text>
  <text x="1055" y="121" class="small">ID: sea_004   Adjacent: 001 / 002 / 005</text>
  <!-- legend -->
  <rect x="35" y="700" width="455" height="88" rx="16" fill="#08243d" fill-opacity=".88" stroke="#6faec5" stroke-width="2"/>
  <circle cx="68" cy="735" r="10" fill="#ffe47a"/><text x="90" y="742" class="small">当前选中区域（黄色边缘）</text>
  <path d="M55 770 L90 770" stroke="#fff3ab" stroke-width="5" stroke-dasharray="8 7"/><text x="105" y="777" class="small">逻辑连接 / 可规划航线（示意）</text>
  <text x="1350" y="790" text-anchor="end" class="tiny">示意图：占位色块与演示连接，不代表正式地图或实际拓扑数据</text>
</svg>
