<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820">
  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#082d50"/>
      <stop offset="0.55" stop-color="#0b5277"/>
      <stop offset="1" stop-color="#06314f"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#173d5c" stop-opacity=".96"/>
      <stop offset="1" stop-color="#08243d" stop-opacity=".96"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="waves" width="150" height="70" patternUnits="userSpaceOnUse">
      <path d="M0 24 Q30 10 60 24 T120 24 T180 24 M-30 55 Q0 41 30 55 T90 55 T150 55" fill="none" stroke="#77bad0" stroke-opacity=".12" stroke-width="2"/>
    </pattern>
    <style>
      .region { stroke:#d6f0f8; stroke-width:5; stroke-linejoin:round; stroke-opacity:.88; }
      .region-label { font-family:"DejaVu Sans"; font-size:25px; font-weight:700; fill:#fff; text-anchor:middle; paint-order:stroke; stroke:#123954; stroke-width:3px; stroke-linejoin:round; }
      .region-sub { font-family:"Noto Sans CJK SC"; font-size:18px; fill:#d8f2fb; text-anchor:middle; }
      .small { font-family:"Noto Sans CJK SC"; font-size:18px; fill:#d9edf6; }
      .tiny { font-family:"Noto Sans CJK SC"; font-size:15px; fill:#a8ccdc; }
    </style>
  </defs>
  <rect width="1400" height="820" rx="28" fill="url(#sea)"/>
  <rect width="1400" height="820" rx="28" fill="url(#waves)"/>
  <g opacity=".16" fill="none" stroke="#b7e3ee" stroke-width="2">
    <path d="M-30 170 C180 90 320 250 520 160 S850 80 1030 190 S1280 270 1450 150"/>
    <path d="M-40 650 C160 540 320 720 520 620 S860 520 1030 650 S1280 710 1450 600"/>
    <path d="M120 20 C230 150 170 270 260 370 S380 590 330 820"/>
    <path d="M1060 -10 C980 140 1090 260 1020 390 S940 630 1060 830"/>
  </g>
  <!-- regions, drawn as deliberately simplified placeholder polygons -->
  <path class="region" fill="#2c8cc8" d="M110 160 L250 100 L405 125 L470 210 L435 315 L330 360 L190 335 L105 260 Z"/>
  <path class="region" fill="#37a77e" d="M470 210 L545 125 L725 110 L850 180 L820 300 L710 370 L565 345 L435 315 Z"/>
  <path class="region" fill="#e5a947" d="M850 180 L1010 125 L1175 185 L1255 300 L1170 390 L1010 385 L820 300 Z"/>
  <path class="region" fill="#7468cf" d="M330 360 L435 315 L565 345 L710 370 L755 500 L665 620 L475 650 L330 570 L260 460 Z"/>
  <path class="region" fill="#2da9b8" d="M710 370 L820 300 L1010 385 L1170 390 L1240 525 L1145 665 L955 700 L790 620 L755 500 Z"/>
