  <g fill="#d8c28b" stroke="#fff1c5" stroke-width="3" opacity=".95">
    <path d="M175 425 l22 -18 25 9 8 23 -18 18 -28 -4z"/>
    <path d="M520 70 l20 -24 28 6 13 19 -16 18 -31 -2z"/>
    <path d="M900 470 l18 -20 22 6 9 22 -19 14 -25 -5z"/>
    <path d="M1080 90 l16 -17 20 5 8 16 -18 14 -22 -4z"/>
    <path d="M680 700 l13 -16 19 3 7 15 -16 12z"/>
  </g>
  <g fill="#2b5d58" opacity=".9">
    <path d="M187 430 l17 -15 14 12 -16 12z"/><path d="M532 73 l18 -15 13 13 -16 11z"/>
    <path d="M910 474 l13 -14 12 13 -14 9z"/><path d="M1086 94 l12 -12 12 11 -12 9z"/>
  </g>
